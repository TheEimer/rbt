# @package _global_
defaults:
  - override /hydra/launcher: submitit_slurm

hydra:
  launcher:
    partition: ai,tnt
    cpus_per_task: 32
    gres: null
    timeout_min: 1440 
    mem_gb: 120
    setup:
      - module load Miniforge3
      - conda activate rbt
      - export JAX_PLATFORM_NAME=cpu
      - export JAX_PLATFORMS=cpu