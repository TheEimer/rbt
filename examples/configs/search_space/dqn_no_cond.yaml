seed: 0
hyperparameters:
  hp_config.buffer_batch_size:
    name: buffer_batch_size
    type: categorical
    choices:
      - 4
      - 8
      - 16
      - 32
      - 64
      - 128
      - 256
    default: 32
  hp_config.initial_epsilon:
    name: initial_epsilon
    type: uniform_float
    upper: 1.0
    lower: 0.5
    default: 1.0
    log: false
  hp_config.target_epsilon:
    name: target_epsilon
    type: uniform_float
    upper: 0.2
    lower: 0.001
    default: 0.05
    log: false
  hp_config.learning_rate:
    name: learning_rate
    type: uniform_float
    upper: 0.1
    lower: 1.0e-06
    default: 0.0003
    log: true
  hp_config.use_target_network:
    name: use_target_network
    type: categorical
    choices:
      - true
      - false
    default: true
  hp_config.tau:
    name: tau
    type: uniform_float
    upper: 1.0
    lower: 0.01
    default: 0.1
    log: false
  hp_config.gamma:
    name: gamma
    type: uniform_float
    upper: 1.0
    lower: 0.5
    default: 0.99
    log: false